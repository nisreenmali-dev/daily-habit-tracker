name: Build, Publish and Deploy Task App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/task-manager-devops

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-backend:latest

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy containers to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker network create app-net || true

            docker pull ${{ env.IMAGE_PREFIX }}-backend:latest
            docker stop app-backend || true
            docker rm app-backend || true
            docker run -d --name app-backend \
              --restart unless-stopped \
              --network app-net \
              ${{ env.IMAGE_PREFIX }}-backend:latest

            docker pull ${{ env.IMAGE_PREFIX }}-frontend:latest
            docker stop app-frontend || true
            docker rm app-frontend || true
            docker run -d --name app-frontend \
              --restart unless-stopped \
              --network app-net \
              -p 80:80 \
              ${{ env.IMAGE_PREFIX }}-frontend:latest

            docker image prune -f
